[project]
name = "airbyte-mcp"
version = "1.0.0"
description = "MCP server for the Airbyte Public API (self-managed / Cloud)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Latorre" }]
keywords = [
    "python",
    "etl",
    "mcp",
    "data-integration",
    "airbyte",
    "llm-tools",
    "model-context-protocol",
    "mcp-server",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/trustxai/airbyte-mcp"
Repository = "https://github.com/trustxai/airbyte-mcp"
Issues = "https://github.com/trustxai/airbyte-mcp/issues"
Changelog = "https://github.com/trustxai/airbyte-mcp/blob/main/CHANGELOG.md"

[project.scripts]
airbyte-mcp = "airbyte_mcp.server:main_stdio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airbyte_mcp"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.11",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: integration tests against a real Airbyte instance (requires .env credentials)",
    "destructive: mutating integration tests (requires AIRBYTE_TEST_ALLOW_DESTRUCTIVE=1)",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["mcp", "pydantic", "httpx"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["airbyte_mcp.*"]
disallow_untyped_defs = true
